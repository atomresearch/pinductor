# condition=direct_llm_fo env=blocks
# Direct LLM: the model is asked for the next action, with no induced model, no
# particle filter and no planner. It sees the true state, the same
# demonstrations every other method reads, and the environment's API file.
#
# This is the ablation that separates the pipeline from the language model. It
# is the fully observed half of the pair; its counterpart is
# `direct_llm_po/blocks.yaml`.
#
# The protocol matches the other conditions on this environment.

defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

max_steps: 120
num_episodes: 3
seed: 0
gamma: 0.98
save_log: false
replay_path: None

instance: "rand6"
env_name: &env_name "Blocks-rand6-po-v0"
actions: &actions [0, 1, 2, 3]

env:
  _target_: uncertain_worms.environments.blocksworld.blocksworld_env.BlocksEnvironment
  instance: ${instance}

agent:
  _target_: uncertain_worms.policies.direct_llm_fo_agent.DirectLLMFullyObsPolicy
  env_code_path: environments/blocksworld
  dataset_path: "environments/blocksworld/trajectory_data/rand6_demos.pkl"
  actions: *actions
  fully_obs: true
