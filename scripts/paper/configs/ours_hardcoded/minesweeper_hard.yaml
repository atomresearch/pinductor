# condition=ours_hardcoded env=minesweeper_hard
# The environment's ground-truth models run through this paper's own filter and
# planner. Nothing is induced: transition, reward, observation and initial
# distribution all come from the environment, so a failure here is a filter or
# planner problem rather than an induction one. No API key needed.
#
# Derived from the Easy file by the three values the difficulty changes: a
# 8x8 board with ten mines, 64 actions and a 54-step cap, which is rows x cols minus mines.
#
# This is not the configuration that produced the reported GT number for
# MineSweeper. That run used belief-side options developed after this release
# (survival conditioning, repeated-action masking, a terminal-action filter),
# which this agent does not have. Treat the value this config produces as the
# submission-era ground-truth reference, not as a reproduction of the reported
# one.
defaults:
- override hydra/job_logging: colorlog
- override hydra/hydra_logging: colorlog
max_steps: 54
num_episodes: 3
seed: 0
gamma: 0.98
save_log: false
replay_path: None
actions: &id001
- 0
- 1
- 2
- 3
- 4
- 5
- 6
- 7
