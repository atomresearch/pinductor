env_name: MineSweeperHard
difficulty: hard
extras:
  environment: minesweeper_hard
  approach: ours_hardcoded
env:
  _target_: uncertain_worms.environments.popgym.popgym_env.PopGymEnvironment
  env_id: ${env_name}
  wrappers:
  - previous_action
  - antialias
  - markovian_info
  - flatten
  - discrete_action
agent:
  _target_: uncertain_worms.policies.partially_obs_planning_agent.PartiallyObsPlanningAgent
  fully_obs: false
  actions: *id001
  max_attempts: 5000
  num_particles: 80
  state_sampler:
    _target_: uncertain_worms.environments.popgym.sample_state.make_popgym_state_sampler
    reference_state:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_empty_state_gen
  empty_state:
    _target_: uncertain_worms.environments.popgym.popgym_env.popgym_empty_state_gen
  empty_observation:
    _target_: uncertain_worms.environments.popgym.popgym_env.popgym_empty_observation_gen
  planner:
    _target_: uncertain_worms.planners.PO_DAStar.PO_DAStar
    actions: *id001
    max_expansions: 30
    lambda_coeff: 0.01
    entropy_coeff: 0.05
    empty_observation:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_empty_observation_gen
    initial_model:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_minesweeper_initial_model_gen
      difficulty: ${difficulty}
    transition_model:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_minesweeper_transition_model_gen
      difficulty: ${difficulty}
    reward_model:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_minesweeper_reward_model_gen
      difficulty: ${difficulty}
    observation_model:
      _target_: uncertain_worms.environments.popgym.popgym_env.popgym_minesweeper_observation_model_gen
      difficulty: ${difficulty}
