[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertain_worms"
version = "0.1.0"
description = "Pinductor: LLM-guided POMDP world-model induction from observations."

# Core deps for the minigrid POMDP experiments. Heavy robotics / 3D / Spot
# packages from the baseline release are not needed for the paper experiments
# and are intentionally absent.
dependencies = [
    "numpy==1.26.4",
    "scipy>=1.10.0",
    "gymnasium==0.28.1",
    "minigrid==2.3.1",
    "matplotlib>=3.9.2",
    "imageio>=2.35.1",
    "python-dotenv==1.0.1",
    "openai==1.53.0",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "pygame==2.6.1",
    "torch==2.2.2",
    "tensorboard==2.18.0",
    "pyro-ppl==1.9.1",
    "graphviz==0.20.3",
    "requests==2.32.3",
    "pytest>=7.0.0",
    "pyvis==0.3.2",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
# Optional: numba accelerates the particle-filter distance kernel.
fast = ["numba>=0.59"]
# Optional: tueplots gives the paper-style plot bundle used to render figures.
plots = ["tueplots>=0.0.18"]
dev = [
    "black==23.9.1",
    "docformatter==1.7.5",
    "isort==5.12.0",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uncertain_worms*", "particle_filtering*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
uncertain_worms = [
    "policies/prompts/*.txt",
    "policies/prompts/*.json",
    "environments/minigrid/model_templates/*.txt",
    "environments/minigrid/trajectory_data/*.pkl",
]
