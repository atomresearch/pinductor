<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="The Pinductor pipeline: a replay buffer of state-free trajectories and model templates prompt an LLM to propose POMDP components; a particle filter scores them against observations and feeds refinement back; the selected model drives a POMDP solver in the environment, and episodes return to the buffer."><defs><marker id="ah-light" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#57606a"/></marker></defs><style>.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.math{font-family:&quot;STIX Two Math&quot;,&quot;Cambria Math&quot;,&quot;Latin Modern Math&quot;,&quot;Times New Roman&quot;,serif}
.flow{stroke-dasharray:7 6;animation:fl 1.4s linear infinite}.back{animation-duration:2.2s}
@keyframes fl{to{stroke-dashoffset:-26}}
.pulse{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{opacity:.75}50%{opacity:1}}
